MEMORY {
    LOADADDR: start = $07FF, size = 2, file = %O;
    MAIN:     start = $0801, size = $C7FF, file = %O;
    LOW:      start = $0200, size = $01C0;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = MAIN, type = ro;
    UNPACK:   load = MAIN, run = LOW, type = ro, define = yes;
    BLOB:     load = MAIN, type = ro, define = yes;
}
