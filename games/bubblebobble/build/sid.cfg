# Linker config for standalone SID build
#
# Used by build-sid.py to build a PSID v2 SID file from any conforming
# sound engine. All segments are placed contiguously in a single memory
# region at a configurable base address (passed via -D __BASE__=xxxx).
#
# SOUND_HI is page-aligned to satisfy alignment constraints in the
# sound engine (e.g. music_track_pointers low byte bits 1-3 must be zero).
#
# Output: single binary file containing all segments.

SYMBOLS {
    __BASE__: type = import, addrsize = absolute;
}

MEMORY {
    MAIN: file = %O, start = __BASE__, size = $4000, fill = yes;
}

SEGMENTS {
    SOUND_LO:         load = MAIN, type = rw;
    TMP_SCREEN_BACKUP: load = MAIN, type = rw;
    SOUND_HI:         load = MAIN, type = rw, align = $100;
    SID_STUB:         load = MAIN, type = rw;
}
