# C64 PRG linker config
#
# =======================================================================
# Memory Regions
# =======================================================================
#
# PRG file regions (hardware constraints):
#   PRG_LO:    General code/data ($0400-$3FFF)
#   VIC_BANK:  Graphics visible to VIC-II ($4000-$7FFF)
#   PRG_MID:   General code/data ($8000-$CFFF)
#   IO_SHADOW: RAM under I/O registers ($D000-$DFFF), requires $01=$30
#   PRG_HIGH:  General code/data ($E000-$FFFA)
#
# Runtime temporary regions (load-time data, overwritten during gameplay):
#   TMP_CHARSET_EXT:    Title logo chars -> enemy template data ($4400)
#   TMP_INIT_CODE:      Init code -> work RAM ($4460)
#   TMP_WORK_BUFFERS:   Init data -> work RAM ($4C00)
#   TMP_SCREEN_BACKUP:  Title music -> screen backup buffer ($8B00)
#
# To move load-time data, change its segment to target a different TMP_* region.
# The linker enforces size limits for each runtime region.
#
# =======================================================================
# Segment Naming Convention
# =======================================================================
#
# Prefix indicates placement constraints:
#   VIC_  - Must be in VIC_BANK (VIC-II visible graphics)
#   IO_   - Can be placed in IO_SHADOW (accessed only with $01=$30)
#   TMP_  - Load-time data targeting a temporary runtime region
#   (none)- Cannot be in IO_SHADOW (normal code/data)
#
# =======================================================================
# C64 Memory Map Reference
# =======================================================================
#
# $0000-$00FF  Zero Page     - CPU/BASIC/game variables, entity arrays
# $0100-$01FF  Stack         - 6502 stack, portions used as temp buffers
# $0200-$033B  BASIC work    - Level pointer tables
# $033C-$03FB  Cassette buf  - 192 bytes FREE during gameplay
# $0400-$3FFF  PRG_LO        - General code/data (pre-VIC bank)
# $4000-$7FFF  VIC_BANK      - Charset, screens, sprites (VIC-visible)
# $8000-$CFFF  PRG_MID       - General code/data (post-VIC bank)
# $D000-$DFFF  IO_SHADOW     - RAM under I/O, needs $01=$30 for access
# $E000-$FFFA  PRG_HIGH      - General code/data (post-I/O region)
#
# =======================================================================

FEATURES {
    STARTADDRESS: default = $0400;
}

SYMBOLS {
    __LOADADDR__: type = export, value = $0400;

    # =======================================================================
    # VIC Bank Layout - Single source of truth
    # =======================================================================
    __VIC_BANK_BASE__:     type = export, value = $4000;
    __VIC_CHARSET_A__:     type = export, value = __VIC_BANK_BASE__ + $0000;
    __VIC_CHARSET_B__:     type = export, value = __VIC_BANK_BASE__ + $0800;
    __VIC_SCREEN_A__:      type = export, value = __VIC_BANK_BASE__ + $1000;
    __VIC_SCREEN_B__:      type = export, value = __VIC_BANK_BASE__ + $1400;
    __VIC_SPRITES_START__: type = export, value = __VIC_BANK_BASE__ + $1800;

    # --- CIA2 Port A values ---
    __VIC_BANK_BITS__:     type = export, value = 3 - __VIC_BANK_BASE__ / $4000;
    __CIA2_PRA_GAME__:     type = export, value = $94 + __VIC_BANK_BITS__;
    __CIA2_PRA_INIT__:     type = export, value = $C7;

    # --- VIC_MEMPTR ($D018) register values ---
    __VIC_MEMPTR_INIT__: type = export, value =
        ((__VIC_CHARSET_B__ - __VIC_BANK_BASE__) / $400) * 16 +
        ((__VIC_CHARSET_A__ - __VIC_BANK_BASE__) / $800) * 2;
    __VIC_MEMPTR_A__:    type = export, value =
        ((__VIC_SCREEN_A__ - __VIC_BANK_BASE__) / $400) * 16 +
        ((__VIC_CHARSET_A__ - __VIC_BANK_BASE__) / $800) * 2;
    __VIC_MEMPTR_B__:    type = export, value =
        ((__VIC_SCREEN_B__ - __VIC_BANK_BASE__) / $400) * 16 +
        ((__VIC_CHARSET_B__ - __VIC_BANK_BASE__) / $800) * 2;

    # --- Sprite pointer base ---
    __SPRITE_PTR_BASE__: type = export, value =
        (__VIC_SPRITES_START__ - __VIC_BANK_BASE__) / 64;

    # =======================================================================
    # Special Memory Region Addresses
    # =======================================================================
    __ZEROPAGE_START__:    type = export, value = $0002;
    __ZEROPAGE_END__:      type = export, value = $00FF;
    __IO_SHADOW_START__:   type = export, value = $D000;
    __IO_SHADOW_END__:     type = export, value = $DFFF;

    # =======================================================================
    # Runtime Buffer Aliases
    # =======================================================================
    # These provide semantic names for runtime use of temporary regions.
    # Code references these for runtime buffer access, independent of what
    # load-time data occupies the region.
    __SCREEN_BACKUP__:     type = export, value = $8B00;  # -> TMP_SCREEN_BACKUP
}

MEMORY {
    # -----------------------------------------------------------------------
    # Runtime-only Memory Regions (no file output)
    # -----------------------------------------------------------------------
    CASSETTE:  file = "", start = $033C, size = $00C0, type = rw, define = yes;

    # -----------------------------------------------------------------------
    # Runtime Temporary Regions
    # -----------------------------------------------------------------------
    # These regions contain load-time data that gets overwritten during gameplay.
    # Segments can target these regions; linker enforces size limits.
    # define = yes exports __NAME_START__, __NAME_SIZE__, etc.

    # Title logo characters -> enemy template data (in VIC bank)
    TMP_CHARSET_EXT:   file = "", start = $4400, size = $0060, define = yes;

    # Init code -> work RAM (in VIC bank, after charset)
    TMP_INIT_CODE:     file = "", start = $4460, size = $03A0, define = yes;

    # Init data -> work RAM (in VIC bank)
    TMP_WORK_BUFFERS:  file = "", start = $4C00, size = $0400, define = yes;

    # Title music -> screen backup buffer (in PRG_MID)
    TMP_SCREEN_BACKUP: file = "", start = $8B00, size = $0400, define = yes;

    # -----------------------------------------------------------------------
    # PRG File Memory Regions
    # -----------------------------------------------------------------------
    LOADADDR:  file = %O, start = $0400 - 2, size = 2;
    PRG_LO:    file = %O, start = $0400, size = $3C00, fill = yes;  # $0400-$3FFF
    VIC_BANK:  file = %O, start = $4000, size = $4000, fill = yes;  # $4000-$7FFF
    PRG_MID:   file = %O, start = $8000, size = $5000, fill = yes;  # $8000-$CFFF
    IO_SHADOW: file = %O, start = $D000, size = $1000, fill = yes;  # $D000-$DFFF
    PRG_HIGH:  file = %O, start = $E000, size = $1FFB, fill = yes;  # $E000-$FFFA
}

SEGMENTS {
    LOADADDR:          load = LOADADDR, type = ro;

    # =======================================================================
    # PRG_LO ($0400-$3FFF) - Game Code Segments
    # =======================================================================
    # Split into logical modules for flexibility when relocating code.
    # All segments load sequentially into PRG_LO region.
    #
    # Segment groupings by functionality:
    #   CODE_VARIABLES    - Game state data, scores, lives ($0400)
    #   CODE_PLAYER_STATE - Player death/respawn, join game ($045C)
    #   CODE_IRQ          - IRQ handlers, sprite setup ($06AB)
    #   CODE_GAMELOOP     - Main game loop, collision ($08E4)
    #   CODE_ENEMY        - Enemy AI, special enemies ($0CF2)
    #   CODE_SPRITES      - Player/bubble sprite updates ($1319)
    #   CODE_RENDER       - Screen rendering, input, animation ($1844)
    #   CODE_PHYSICS      - Entity interaction, movement ($2162)
    #   CODE_ITEMS        - Spawning, items, level setup ($284D)
    #   CODE_EFFECTS      - Power-ups, level transitions ($2D65)
    #   CODE_PLATFORM     - Platform collision, EXTEND bonus ($3169)
    #   CODE_BONUS        - Bonus round handling ($348A)
    #   CODE_LEVEL_DISP   - Level display, scrolling ($37C7)
    #   CODE_ENTITY_TBLS  - Entity tables, sprite init ($3C01)
    # -----------------------------------------------------------------------
    # CONSTRAINT: CODE_VARIABLES must start at a page boundary ($xx00) because
    # sprite-composer.s uses an indirect jump through game_variables where the
    # self-modifying code computes the low byte as (entity_type + $0C), assuming
    # game_variables starts at offset $00 within its page.
    # See sprite-composer.s:smc_jmp_indirect.
    CODE_VARIABLES:    load = PRG_LO, type = rw, align = $100;
    CODE_PLAYER_STATE: load = PRG_LO, type = rw;
    CODE_IRQ:          load = PRG_LO, type = rw;
    CODE_GAMELOOP:     load = PRG_LO, type = rw;
    CODE_ENEMY:        load = PRG_LO, type = rw;
    CODE_SPRITES:      load = PRG_LO, type = rw;
    CODE_RENDER:       load = PRG_LO, type = rw;
    CODE_PHYSICS:      load = PRG_LO, type = rw;
    CODE_ITEMS:        load = PRG_LO, type = rw;
    CODE_EFFECTS:      load = PRG_LO, type = rw;
    CODE_PLATFORM:     load = PRG_LO, type = rw;
    CODE_BONUS:        load = PRG_LO, type = rw;
    CODE_LEVEL_DISP:   load = PRG_LO, type = rw;
    CODE_ENTITY_TBLS:  load = PRG_LO, type = rw;

    # =======================================================================
    # VIC_BANK ($4000-$7FFF) - VIC-visible graphics
    # =======================================================================
    # VIC_ segments: must be in VIC_BANK for hardware visibility
    VIC_CHARSET:       load = VIC_BANK, type = ro, start = __VIC_CHARSET_A__;

    # TMP_ segments: load-time data in temporary runtime regions
    TMP_CHARSET_EXT:   load = VIC_BANK, run = TMP_CHARSET_EXT, type = ro;
    TMP_INIT_CODE:     load = VIC_BANK, run = TMP_INIT_CODE, type = rw;

    VIC_CHARSET_B:     load = VIC_BANK, type = rw, start = __VIC_CHARSET_B__;
    TMP_WORK_BUFFERS:  load = VIC_BANK, run = TMP_WORK_BUFFERS, type = ro;
    VIC_SCREEN_RAM:    load = VIC_BANK, type = ro, start = __VIC_SCREEN_A__;
    VIC_SPRITES_GAME:  load = VIC_BANK, type = ro, start = __VIC_SPRITES_START__;
    SOUND_LO:          load = VIC_BANK, type = rw;
    VIC_LEVELS2_SPR1:  load = VIC_BANK, type = ro, align = $40;
    LEVELS2_CODE1:     load = VIC_BANK, type = rw;
    VIC_LEVELS2_SPR2:  load = VIC_BANK, type = ro, align = $40;
    LEVELS2_CODE2:     load = VIC_BANK, type = rw;

    # =======================================================================
    # PRG_MID ($8000-$CFFF)
    # =======================================================================
    BUBBLE_MASKS:      load = PRG_MID, type = ro;
    SPRITES2_PREAMBLE: load = PRG_MID, type = ro;
    SPRITES2_TABLES:   load = PRG_MID, type = ro, align = $100;

    # TMP_ segment: title music -> screen backup buffer
    TMP_SCREEN_BACKUP: load = PRG_MID, run = TMP_SCREEN_BACKUP, type = rw;

    SOFTWARE_SPRITES:  load = PRG_MID, type = ro;
    BONUS_CAKE:        load = PRG_MID, type = ro;
    GAMEINIT1:         load = PRG_MID, type = rw;
    BONUS_MELON:       load = PRG_MID, type = ro;
    BONUS_DIAMOND:     load = PRG_MID, type = ro;
    GAMEINIT2:         load = PRG_MID, type = rw;
    GT_ASM1:           load = PRG_MID, type = ro;
    GT_BIN1:           load = PRG_MID, type = ro;
    GT_ASM2:           load = PRG_MID, type = ro;
    GT_BIN2:           load = PRG_MID, type = ro;
    GT_ASM3:           load = PRG_MID, type = ro;
    ENEMY_SPAWNS:      load = PRG_MID, type = ro;
    ITEM_POSITIONS:    load = PRG_MID, type = ro;
    GAMEDATA_WIND:     load = PRG_MID, type = ro;
    SIDEBARS:          load = PRG_MID, type = ro;
    LEVEL_TILES:       load = PRG_MID, type = ro;
    PHYSICS_FLAGS:     load = PRG_MID, type = ro;
    # IO_LEVEL_BITMAPS + IO_LEVEL_BITMAPS_HI: level bitmap data split at $D000.
    # The split offset is hardcoded in src/binaries.s (LEVEL_BITMAPS_SPLIT or
    # COMPRESSED_SPLIT). If IO_LEVEL_BITMAPS moves, update the split there.
    BBLAN_CODE:        load = PRG_MID, type = rw, optional = yes;
    IO_LEVEL_BITMAPS:  load = PRG_MID, type = ro, start = __LEVEL_BM_START__;

    # =======================================================================
    # IO_SHADOW ($D000-$DFFF) - RAM under I/O, needs $01=$30
    # =======================================================================
    # IO_ segments: these live in the I/O shadow region.
    # Only accessible with $01=$30 (I/O banked out).
    IO_LEVEL_BITMAPS_HI:   load = IO_SHADOW, type = ro;
    IO_BITMAP_DECODE_TABLE: load = IO_SHADOW, type = ro;
    IO_BITMAP_DICT_PAIRS:  load = IO_SHADOW, type = ro;
    IO_CODE_DECOMPRESSOR:  load = IO_SHADOW, type = rw;

    # =======================================================================
    # PRG_HIGH ($E000-$FFFA)
    # =======================================================================
    CODE_LEVEL_RENDERER:   load = PRG_HIGH, type = rw;
    CODE_SPRITES_DISPLAY:  load = PRG_HIGH, type = rw;
    CODE_LINE_DRAW:        load = PRG_HIGH, type = rw;
    CODE_SPRITE_COMPOSER:  load = PRG_HIGH, type = rw;
    CODE_ENTITY:           load = PRG_HIGH, type = rw;
    CODE_TITLE_DATA:       load = PRG_HIGH, type = rw;
    CODE_CREDITS:          load = PRG_HIGH, type = rw;
    SOUND_HI:              load = PRG_HIGH, type = rw, align = $40;
    HUDFONT:               load = PRG_HIGH, type = ro;
    LEVEL_COLORS:          load = PRG_HIGH, type = ro;
    LEVEL_FLAGS:           load = PRG_HIGH, type = ro;
    FILE_PADDING:          load = PRG_HIGH, type = ro;

    # =======================================================================
    # Runtime-only (not in PRG file)
    # =======================================================================
    # Example: EXPANSION: load = CASSETTE, type = rw;
}
